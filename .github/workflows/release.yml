# Releases for dnsmasq-manager.
#
# release-please reads the Conventional Commits on main and keeps a release
# pull request open with the next version and the changelog. Merging that pull
# request tags the version and creates the GitHub release as a draft, with its
# tag forced so the tag exists while the release is a draft. The release
# stays a draft until the assets job has built the files with `make dist`,
# attached them and published it. If that job fails, the release stays a
# draft, `latest` stays on the previous release, and re-running the job
# finishes it.
#
# The version rules live in release-please-config.json. The release pull
# request is titled "build: release <version>" there, because the default
# title uses a commit type this repository does not allow.
name: Release

on:
  # Every commit that lands on main either updates the release pull request
  # or, when the commit is the merged release pull request, cuts the release.
  push:
    branches: [main]

# Nothing by default. Each job below asks for exactly what it needs.
permissions: {}

# One release run at a time, and never cancel one part way: a cancelled run
# could leave a draft release without its assets.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Opens or updates the release pull request, and creates the tag and the
  # GitHub release when that pull request has been merged. The release is a
  # draft and its tag is forced (`draft` and `force-tag-creation` in
  # release-please-config.json); it stays a draft until the assets job
  # publishes it.
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      # Push the release branch, the tag and the GitHub release.
      contents: write
      # Open and update the release pull request.
      pull-requests: write
      # Create and apply the "autorelease" labels, which go through the
      # issues API.
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A third-party action holding a write token, so it is pinned to a
      # commit rather than a tag that can be moved. Update the SHA and the
      # version comment together.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Builds the release files from the tagged commit, attaches them to the
  # draft release (the binary, its SHA-256 checksum and install.sh) and then
  # publishes it, through scripts/publish-release.sh. Until the last step
  # succeeds the release is a draft and `latest` stays on the previous
  # release. If the job fails, re-run it: the upload replaces files a partial
  # run attached, and a release that is already published is left alone.
  #
  # This job is in the release workflow, not one triggered by the release
  # event, because a release created with GITHUB_TOKEN starts no other
  # workflow.
  assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      # Upload assets to the release and publish it.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Build exactly what was tagged, not whatever main has moved to.
          # The tag exists while the release is still a draft only because
          # force-tag-creation is set in release-please-config.json.
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # This job holds a write token, so it does not restore a cache that
          # other runs could have written.
          cache: false
      - name: Build, upload and publish the release
        env:
          # Passed through the environment so the tag is never expanded
          # inside the script text.
          TAG: ${{ needs.release-please.outputs.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          make dist VERSION="$TAG"
          bash scripts/publish-release.sh "$TAG" dist
