# Continuous integration for dnsmasq-manager.
#
# Every step calls a Makefile target, so CI runs exactly what a developer or
# the cloud session-start hook runs locally. When a check changes, change the
# Makefile, not this file.
name: CI

on:
  # Every commit that lands on main is checked.
  push:
    branches: [main]
  # Pull requests from any branch, including forks, are checked before merge.
  pull_request:

# Least privilege: the jobs only read the repository. Nothing here pushes,
# comments, publishes or uploads.
permissions:
  contents: read

# One run per ref at a time. A new push to the same pull request cancels the
# run it supersedes, so only the latest commit spends runner minutes. Pushes to
# main are never cancelled, so every commit that lands on main gets a complete
# run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Static analysis (`make lint`: golangci-lint, shellcheck on every shell
  # file and actionlint on these workflows) plus the fast tests: Go unit
  # tests (with the race detector), the session-start hook tests, the release
  # script's tests (scripts/publish-release.sh against a stub gh) and the
  # installer's stub suite, which run against stub commands and need only
  # bash (and dash for the installer).
  lint-and-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # go-version-file reads the `go` directive in go.mod, so CI follows the
      # module's Go version without a second copy of it here. setup-go also
      # puts the Go bin directory on PATH ahead of any preinstalled tools.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Installs the golangci-lint and actionlint versions pinned in the
      # Makefile into the Go bin directory. `make lint` resolves both from
      # PATH first, and setup-go put that directory on PATH, so lint uses the
      # pinned copies.
      - run: make tools
      # golangci-lint, shellcheck on every shell file and actionlint on the
      # workflows. shellcheck is expected to be preinstalled on the runner;
      # if it is ever missing this step fails rather than silently skipping
      # the check.
      - run: make lint
      # `go test -race` needs cgo and a C compiler; gcc ships on the runner.
      - run: make test
      - run: make test-hook
      - run: make test-release
      # The installer's stub suite runs install.sh under TEST_SH, default
      # /bin/dash. Ubuntu ships dash in every install as the shell /bin/sh
      # links to, so /bin/dash exists on the runner without any setup.
      - run: make test-install

  # The installer end to end in Alpine 3.23, the minimum it supports: the
  # real install.sh under BusyBox ash, fetching the real binary from a local
  # HTTP server in the container, then the stub suite under BusyBox ash.
  # Docker is preinstalled on the runner. Go is set up because the make
  # target builds dist/ on the runner and bind-mounts it into the container.
  install-alpine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test-install-docker

  # Integration probes against Ubuntu's packaged dnsmasq, run directly on the
  # runner. This catches behaviour that differs from the pinned Alpine
  # build below and exercises `make integration` as a developer on Linux
  # would run it.
  integration-ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The probes are Go tests built with the integration tag, so they need
      # the toolchain.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # dnsmasq-base provides the dnsmasq binary without the dnsmasq package's
      # system service, which would try to bind port 53 and clash with
      # systemd-resolved. The tests start their own dnsmasq on a free port.
      # dnsutils provides dig, which the tests query with.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dnsmasq-base dnsutils
      - run: make integration

  # Integration probes in Alpine 3.23 against dnsmasq 2.91, the release and
  # version the production host runs and the minimums the service supports.
  # The Dockerfile builds the test binary in a Go image and asserts the dnsmasq
  # version, so the job needs only Docker, which is preinstalled on the
  # runner; no Go setup is required.
  integration-alpine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: make integration-docker

  # Builds the release binary for the DNS host and checks it is statically
  # linked, so it runs on the Alpine host whatever C library it was built
  # against.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build
      # `make build` sets CGO_ENABLED=0. Fail the job if the binary is ever
      # dynamically linked, for example because that setting was lost.
      - name: Check the binary is statically linked
        run: |
          out=$(file bin/dnsmasq-manager)
          echo "$out"
          if ! grep -q 'statically linked' <<<"$out"; then
            echo "::error file=Makefile::bin/dnsmasq-manager is not statically linked"
            exit 1
          fi

  # The real external-dns v0.24.0 against the service beside dnsmasq 2.91, with
  # a throwaway k3s as the Kubernetes API it reads Ingresses from, all under
  # Docker Compose. Docker and its compose plugin are preinstalled on the
  # runner, and the service image builds the binary itself, so no Go setup is
  # needed. k3s runs privileged, which the hosted runner allows. Takes about
  # two to three minutes, most of it the fixed "nothing must change" windows.
  e2e:
    runs-on: ubuntu-24.04
    # A normal run takes two to three minutes. A stack that hangs (k3s never
    # ready, a wait loop that never ends) is cut off here rather than holding
    # a runner for GitHub's six-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: make e2e
